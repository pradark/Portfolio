name: Update dashboard

on:
  # 05:00 UTC every day = 1:00 AM US Eastern (EDT).
  # Note: GitHub Actions cron is fixed-UTC, so during EST (Nov–Mar) this fires at 12:00 AM ET.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/build.py"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write   # commit the refreshed index.html back to THIS repo (history)

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build dashboard
        run: python scripts/build.py

      - name: Commit refreshed index.html (this private repo)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh dashboard $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Set up SSH agent for site deploy
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SITE_DEPLOY_KEY }}

      - name: Publish index.html to public site repo
        env:
          SITE_REPO: git@github.com:pradark/portfolio-site.git
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 "$SITE_REPO" "$tmp/site"
          cp index.html "$tmp/site/index.html"
          cd "$tmp/site"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No site changes to push."
          else
            git commit -m "site: refresh dashboard $(date -u +'%Y-%m-%d')"
            git push origin HEAD
          fi
